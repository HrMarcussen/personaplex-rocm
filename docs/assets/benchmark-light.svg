<title id="title">PersonaPlex on RX 7900 XTX: time per 80 ms audio frame</title>
<desc id="desc">Lower is better; real time requires under 80 ms. Upstream code, eager PyTorch: 211.5 ms (0.38x real time); + HIP graphs: 87.9 ms (0.91x real time); + GEMM tuning, codec fixes: 57.7 ms (1.39x real time); + custom HIP kernels (bf16): 32.5 ms (2.46x real time); + int8 weights (optional): 23.8 ms (3.36x real time).</desc>
