name: Bug report
description: Something does not work or is slower than expected on your AMD GPU.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [FAQ](https://github.com/HrMarcussen/personaplex-rocm#faq) first.
        Issues with the model itself (what it says, languages, voices) belong upstream at
        [NVIDIA/personaplex](https://github.com/NVIDIA/personaplex).
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Model and VRAM, e.g. "Radeon RX 7900 XTX 24 GB".
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: AMD driver version
      description: Adrenalin version, or the DriverVersion from `Get-CimInstance Win32_VideoController`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `.\.venv\Scripts\python.exe -c "import torch, moshi; from moshi import kernels; print(torch.__version__, torch.version.hip, torch.cuda.get_device_name(0), kernels.available())"`
      render: text
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Default (bf16)
        - int8 (PERSONAPLEX_INT8=1)
        - Custom kernels off (PERSONAPLEX_KERNELS=0)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / benchmark output
      description: Server log or the output of `.\.venv\Scripts\python.exe rocm\bench_step.py --random`. Remove anything private (tokens, user names in paths) before posting.
      render: text
