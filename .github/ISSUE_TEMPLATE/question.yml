name: Question
description: A question about running PersonaPlex on AMD GPUs with this port.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/HrMarcussen/personaplex-rocm#readme), the
        [FAQ](https://github.com/HrMarcussen/personaplex-rocm#faq), and
        [docs/TECHNICAL.md](https://github.com/HrMarcussen/personaplex-rocm/blob/main/docs/TECHNICAL.md) first.
        Questions about the model itself are best asked upstream at
        [NVIDIA/personaplex](https://github.com/NVIDIA/personaplex).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know? Include your GPU and OS if relevant.
    validations:
      required: true
